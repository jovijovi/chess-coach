name: Publish verified plugin release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Verified draft tag (v0.2.0-rc.N or v0.2.0)"
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: plugin-channel-promotion
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          package-manager-cache: false
      - name: Verify the requested tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          node -e 'if (!/^v0\.2\.0(?:-rc\.[1-9]\d*)?$/.test(process.env.TAG)) process.exit(1)'
          git checkout --detach "refs/tags/$TAG"
      - name: Promote the unchanged, verified draft artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: node scripts/promote-release.mjs "$TAG"
